name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TOP: ${{ github.workspace }}
  KERNEL_OUT: ${{ github.workspace }}/kernel-4.14/out
  MTK_PLATFORM: mt8168
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  KERNEL_DIR: kernel-4.14
  KBUILD_OUTPUT: out
  DEFCONFIG: a05ba_defconfig
  WERROR: "0"
  KCFLAGS: -DPLE_GROUP_DBDC_SIZE=512 -Wno-error -Wno-error=pointer-compare -Wno-pointer-compare -Wno-error=misleading-indentation -Wno-misleading-indentation -Wno-error=restrict -Wno-restrict -Wno-error=stringop-overflow -Wno-stringop-overflow -Wno-error=memset-elt-size -Wno-memset-elt-size -Wno-error=sizeof-array-div -Wno-sizeof-array-div -Wno-error=sizeof-pointer-memaccess -Wno-sizeof-pointer-memaccess -Wno-maybe-uninitialized -Wno-array-bounds -Wno-address-of-packed-member -Wno-missing-attributes -Wno-implicit-function-declaration -Wno-incompatible-pointer-types -Wno-int-conversion -Wno-unused-result -Wno-unused-variable -Wno-unused-function -Wno-return-type -Wno-error=return-type -fno-pie -fno-stack-protector

jobs:
  build-kernel:
    name: Kernel Build - ARM64 (a05ba_defconfig)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            make python3 git curl

      - name: Verify kernel source directory
        run: |
          set -euo pipefail
          if [ ! -d "$KERNEL_DIR" ]; then
            echo "Error: $KERNEL_DIR directory not found"
            exit 1
          fi

      - name: Show kernel version
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          make O="$KBUILD_OUTPUT" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" TOP="$TOP" MTK_PLATFORM="$MTK_PLATFORM" WERROR="$WERROR" kernelversion

      - name: Configure kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          mkdir -p "$KBUILD_OUTPUT"
          make O="$KBUILD_OUTPUT" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" TOP="$TOP" MTK_PLATFORM="$MTK_PLATFORM" WERROR="$WERROR" "$DEFCONFIG"

      - name: Patch xt_connmark.h with missing v1 API definitions
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          patched=0
          for header in include/uapi/linux/netfilter/xt_connmark.h include/linux/netfilter/xt_connmark.h; do
            if [ ! -f "$header" ]; then continue; fi
            if grep -q 'xt_connmark_tginfo1' "$header"; then
              echo "$header: already has v1 API, skipping"
              patched=1
              continue
            fi
            echo "Patching $header"
            cat >> "$header" << 'EOF'
          #ifndef XT_CONNMARK_V1_API_DEFINED
          #define XT_CONNMARK_V1_API_DEFINED
          enum {
              XT_CONNMARK_SET = 0,
              XT_CONNMARK_SAVE,
              XT_CONNMARK_RESTORE
          };
          enum {
              XT_CONNMARK_VALUE = 0,
              XT_CONNMARK_MARK = 1
          };
          struct xt_connmark_tginfo1 {
              __u32 ctmark, ctmask, nfmask;
              __u8 mode;
          };
          struct xt_connmark_tginfo2 {
              __u32 ctmark, ctmask, nfmask;
              __u8 mode, invert;
          };
          struct xt_connmark_mtinfo1 {
              __u32 mark, mask;
              __u8 invert;
          };
          #endif
          EOF
            patched=1
          done
          if [ "$patched" -eq 0 ]; then
            echo "Error: no xt_connmark.h file found to patch"
            exit 1
          fi

      - name: Fix DTC yylloc multiple definition
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          rm -f scripts/dtc/dtc-lexer.lex.c scripts/dtc/dtc-parser.tab.c scripts/dtc/dtc-parser.tab.h
          sed -i 's/^[[:space:]]*YYLTYPE yylloc;[[:space:]]*$/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped

      - name: Fix SELinux classmap error
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          sed -i '/#error New address family defined, please update secclass_map\./s/#error/#warning/' security/selinux/include/classmap.h

      - name: Build kernel image and dtbs
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          make O="$KBUILD_OUTPUT" ARCH="$ARCH" CROSS_COMPILE="$CROSS_COMPILE" TOP="$TOP" MTK_PLATFORM="$MTK_PLATFORM" WERROR="$WERROR" -j"$(nproc)" KCFLAGS="$KCFLAGS" Image.gz dtbs

      - name: List generated artifacts
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          set -euo pipefail
          ls -lh "$KBUILD_OUTPUT/arch/arm64/boot/" || true
          find "$KBUILD_OUTPUT/arch/arm64/boot/dts" -name "*.dtb" | head -n 200 || true

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-4.14-arm64-a05ba_defconfig
          path: |
            kernel-4.14/out/arch/arm64/boot/Image.gz
            kernel-4.14/out/arch/arm64/boot/Image
            kernel-4.14/out/arch/arm64/boot/dts/**/*.dtb
            kernel-4.14/out/.config
            kernel-4.14/out/System.map
            kernel-4.14/out/vmlinux
          retention-days: 30
          compression-level: 6
          include-hidden-files: true

      - name: Upload artifacts to Release
        uses: softprops/action-gh-release@v2
        if: github.event_name != 'pull_request'
        with:
          tag_name: build-${{ github.run_number }}
          name: "Kernel Build - ${{ github.run_number }}"
          draft: false
          prerelease: false
          files: |
            kernel-4.14/out/arch/arm64/boot/Image.gz
            kernel-4.14/out/arch/arm64/boot/Image
            kernel-4.14/out/arch/arm64/boot/dts/**/*.dtb
            kernel-4.14/out/.config
            kernel-4.14/out/System.map
            kernel-4.14/out/vmlinux

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-kernel-4.14
          path: |
            kernel-4.14/out/.config
            kernel-4.14/out/.config.old
            kernel-4.14/out/.config.bak
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14

      - name: Build summary
        if: always()
        run: echo "Kernel build completed (arm64, a05ba_defconfig)"
